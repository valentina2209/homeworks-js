<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Задача №3</h1>

      <p>
        Дано вартість одиниці товару і кількість. Знайти загальну вартість та
        ПДВ (5% від загальної вартості).
      </p>

      <div class="result">
        <script>
          const pricePerUnit = parseFloat(
            prompt("Введіть вартість одиниці товару, грн", 0),
          );
          const quantityOfProduct = parseFloat(
            prompt("Введіть кількість товару, шт/кг"),
          );
          const taxRate = 5;

          const totalCost = pricePerUnit * quantityOfProduct;
          const sumTaxRate = (totalCost * taxRate) / 100;
          const cost = totalCost + sumTaxRate;

          document.write(`
			      Загальна вартість: ${totalCost.toFixed(2)} грн <br>
			      Сума ПДВ: ${sumTaxRate.toFixed(2)} грн <br>
			      Загальна вартість з податком:  ${cost.toFixed(2)} грн
		      `);
        </script>
      </div>

      <a href="../index.html" class="btn-back">Назад до списку</a>
    </div>
  </body>
</html>
