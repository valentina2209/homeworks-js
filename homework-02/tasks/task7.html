<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 7</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Задача №7</h1>

      <p>
        Знайти суму випадкового номера місяця (від 1 до 12) та випадкового
        номера дня (від 0 до 6).
      </p>

      <div class="result">
        <script>
          const minMonth = 1;
          const maxMonth = 12;

          const minDay = 0;
          const maxDay = 6;

          const randomMonth =
            minMonth + Math.floor(Math.random() * (maxMonth - minMonth + 1));
          const randomDay =
            minDay + Math.floor(Math.random() * (maxDay - minDay + 1));

          const sumRandom = randomMonth + randomDay;

          document.write(
            `Рандомний місяць: <strong>${randomMonth}</strong><br> Pандомний день: <strong>${randomDay}</strong><br> Їх сума: <strong>${sumRandom}</strong>`,
          );
        </script>
      </div>

      <a href="../index.html" class="btn-back">Назад до списку</a>
    </div>
  </body>
</html>
